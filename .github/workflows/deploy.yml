name: Build release artefacts and deploy to UFRGS server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate ODK release artefacts
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 node24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release artefacts
        run: |
          cd src/ontology
          rm -rf tmp/
          make prepare_release IMP=false PAT=false MIR=false COMP=false

      - name: Commit artefacts to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add copi.owl copi.ttl copi-base.owl copi-base.ttl copi-full.owl copi-full.ttl copi-simple.owl copi-simple.ttl
          git diff --cached --quiet || git commit -m "chore: update release artefacts [skip ci]"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y-%m-%d)"
          gh release create "$TAG" \
            copi.owl copi.ttl \
            copi-base.owl copi-base.ttl \
            copi-full.owl copi-full.ttl \
            copi-simple.owl copi-simple.ttl \
            --title "$TAG" \
            --notes "Automated release generated by ODK. Version IRI: https://www.inf.ufrgs.br/ontologies/copi/releases/$(date +%Y-%m-%d)/copi.owl (canonical: https://www.inf.ufrgs.br/ontologies/copi/copi.owl)" \
            --repo ${{ github.repository }} \
          || echo "Release $TAG already exists, skipping."

  deploy:
    name: File transfer to ontologies website
    needs: generate
    runs-on: arc-runner-copi

    env:
      ONTOLOGY: copi
      REMOTE_BASE_PATH: ../ontologies/public_html/
      # Dylan700/sftp-upload-action@v1.2.3 declares node20; GitHub enforces node24
      # from 2026-06-16. This override allows node20 actions until September 2026,
      # when it will be removed. Tracked in: fix/sftp-revert-node20 PR #9.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 node24
        with:
          ref: main

      - name: Set release date
        run: echo "RELEASE_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      # Stale pre-migration OWL/TTL orphans at public_html/ root are DEFERRED.
      # They are the only COPI content currently serving; retire them only after
      # copi/copi.owl is confirmed live and returning 200.

      - name: Install sshpass
        run: |
          apt-get update -qq 2>/dev/null || sudo apt-get update -qq
          apt-get install -y -q sshpass 2>/dev/null || sudo apt-get install -y -q sshpass
          sshpass -V

      # Dylan700/sftp-upload-action declares node20. The override that still let
      # node20 actions run (ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION) expired in
      # September 2026, and the action then does nothing at all — no upload, no
      # error, the step still reports success. The 2026-09-24 docs never reached
      # the server that way. scp exits non-zero when it fails.
      - name: Transfer HTML docs to copi/ folder
        run: |
          echo "Uploading docs/ ($(find docs -type f | wc -l) files)..."
          SSHPASS="${FTP_PASS}" sshpass -e scp -r \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=+ssh-rsa \
            docs/. "ontokg@${DEPLOY_HOST}:../ontologies/public_html/copi/" \
            || { echo "FAILED (scp exited $?)"; exit 1; }
          echo "  OK"
        env:
          FTP_PASS: ${{ secrets.FTP }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Stage OWL/TTL artefacts for upload
        run: |
          mkdir -p copi-stage
          cp copi.owl copi.ttl \
             copi-base.owl copi-base.ttl \
             copi-full.owl copi-full.ttl \
             copi-simple.owl copi-simple.ttl \
             index.php .htaccess \
             copi-stage/
          ls -la copi-stage/

      # Dylan700/sftp-upload-action silently truncates existing files to 0 bytes when
      # Node.js 20 runs under the node24 enforcement that started June 2026. It does
      # not error — it just produces 0-byte remote files.
      #
      # Replaced with sshpass+scp.  sshpass is not pre-installed but apt-get returns
      # exit 100 (package not in cache, not a sudo error) — so apt-get update then
      # install works.  scp replaces files atomically and exits non-zero on failure.
      - name: Transfer OWL/TTL variants to copi/ folder
        run: |
          # index.php is listed explicitly: the canonical folder was only ever
          # updated with *.owl/*.ttl, so changes to content negotiation never
          # reached it from CI.
          #
          # .htaccess is NOT uploaded here. The live copy is owned by another
          # account, so scp as ontokg fails with "Permission denied" and takes
          # the whole job down with it; the server ignores it anyway
          # (AllowOverride), and index.php sets the media types itself. It still
          # travels in the releases/ snapshot below.
          for f in copi-stage/*.owl copi-stage/*.ttl copi-stage/index.php; do
            fname=$(basename "$f")
            local_bytes=$(stat -c%s "$f")
            echo "Uploading $fname ($local_bytes bytes)..."
            # ssh-dss dropped from HostKeyAlgorithms: OpenSSH 9.8+ (this runner: 10.2)
            # refuses it as an unknown algorithm name outright ("Bad key types"),
            # not just deprecates it. ssh-rsa alone is enough for this server's host key.
            SSHPASS="${FTP_PASS}" sshpass -e scp \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o HostKeyAlgorithms=+ssh-rsa \
              "$f" "ontokg@${DEPLOY_HOST}:../ontologies/public_html/copi/${fname}" \
              || { echo "  FAILED (scp exited $?)"; exit 1; }
            echo "  OK"
          done
        env:
          FTP_PASS: ${{ secrets.FTP }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      # Same expired-node20 problem as the docs step above: sftp creates the
      # release directory (scp cannot) and fails loudly if the transfer does not
      # happen.
      - name: Transfer versioned snapshot to copi/releases/
        run: |
          echo "Uploading copi-stage/ to releases/${RELEASE_DATE}/ ..."
          SSHPASS="${FTP_PASS}" sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=+ssh-rsa \
            -b - "ontokg@${DEPLOY_HOST}" <<SFTP || { echo "FAILED (sftp exited $?)"; exit 1; }
          cd ../ontologies/public_html/copi/releases
          -mkdir ${RELEASE_DATE}
          cd ${RELEASE_DATE}
          lcd copi-stage
          put *
          ls -la
          bye
          SFTP
          echo "  OK"
        env:
          FTP_PASS: ${{ secrets.FTP }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
